# Rocky Linux 9 — unattended Kickstart
# Docs: https://anaconda-installer.readthedocs.io/en/latest/kickstart.html
# Fed to installer via:  mkksiso --ks ks.cfg in.iso out.iso   (bare-metal USB)
#                   or:  Packer http_directory + inst.ks=http://... (VM test)
#
# WARNING: this WIPES the largest disk found. No confirmation prompt at install time.

text
eula --agreed
firstboot --disable
reboot

# Locale / keyboard — change to taste
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# Network: DHCP, accept default hostname
network --bootproto=dhcp --device=link --activate
network --hostname=rocky-auto

# Root + user. CHANGE THESE. Generate hash: python3 -c 'import crypt;print(crypt.crypt("PW"))'
# Plaintext used here for demo; prefer --iscrypted with a hash in real use.
rootpw --plaintext changeme123
user --name=admin --password=changeme123 --plaintext --groups=wheel

# --- Disk: partitioning lines are generated by %pre into /tmp/part-include ---
# (anaconda parses these BEFORE %pre runs, so they must come via %include,
#  not via in-place sed — that is why the disk commands live in the include.)
%include /tmp/part-include

services --enabled=sshd,NetworkManager

%packages
@^minimal-environment
openssh-server
sudo
vim-minimal
%end

# --- %pre: detect largest disk, emit partitioning commands to /tmp/part-include ---
%pre --interpreter=/bin/bash
# Pick largest block disk by size (bytes). Excludes removable/USB via TYPE=disk.
largest=$(lsblk -dnb -o NAME,TYPE,SIZE | awk '$2=="disk"{print $3, $1}' | sort -rn | head -1 | awk '{print $2}')
cat > /tmp/part-include <<EOF
ignoredisk --only-use=${largest}
clearpart --all --initlabel --drives=${largest}
autopart --type=lvm
bootloader --location=mbr --boot-drive=${largest}
EOF
%end

%post
# Passwordless sudo for wheel
echo "%wheel ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel-nopasswd
chmod 440 /etc/sudoers.d/wheel-nopasswd
%end
